name: Build UltraChess OEX APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Check native engine exists
        run: |
          if [ ! -f android-oex/app/src/main/jniLibs/arm64-v8a/libultrachess.so ]; then
            echo "ERROR: Missing libultrachess.so"
            exit 1
          fi
          ls -lh android-oex/app/src/main/jniLibs/arm64-v8a/libultrachess.so

      - name: Setup Gradle Wrapper
        working-directory: android-oex
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: android-oex
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UltraChess-OEX-APK
          path: android-oex/app/build/outputs/apk/debug/*.apk
          retention-days: 30
