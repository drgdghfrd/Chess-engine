name: Engine regression

on:
  push:
    branches: [ main, master, "benchmark/**" ]
  pull_request:
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run benchmark unit tests
        run: python -m unittest discover -s tools/tests -p "test_*.py" -v

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build perft regression
        run: cmake --build build --target ultrachess-perft --parallel

      - name: Run perft regression
        run: ./build/ultrachess-perft

  reference-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python benchmark dependency
        run: python -m pip install --upgrade pip python-chess

      - name: Install reference engine
        run: |
          sudo apt-get update
          sudo apt-get install -y stockfish

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build engine
        run: cmake --build build --target ultrachess --parallel

      - name: Run two-game reference smoke
        run: |
          mkdir -p results
          python3 tools/arena.py             --engine-a ./build/ultrachess             --engine-b "$(command -v stockfish)"             --validator ./build/ultrachess             --games 2             --depth 3             --alternate             --openings tools/benchmark/openings_12x4.txt             --jsonl-out results/reference-smoke.jsonl             --pgn-out results/reference-smoke.pgn

      - name: Upload smoke results
        uses: actions/upload-artifact@v4
        with:
          name: reference-smoke-results
          path: results/
          retention-days: 14
