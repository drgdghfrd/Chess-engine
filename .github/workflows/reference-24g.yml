name: Reference 24-game benchmark v4

on:
  push:
    branches:
      - experiment/reference-24g-v4

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install benchmark dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y stockfish
          python -m pip install --upgrade pip python-chess

      - name: Record reference version
        run: |
          stockfish --version | tee results-stockfish-version.txt

      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target ultrachess ultrachess-perft ultrachess-position-regression --parallel
          ./build/ultrachess-perft
          ./build/ultrachess-position-regression

      - name: Run 24-game benchmark
        run: |
          mkdir -p results
          python3 tools/arena.py             --engine-a ./build/ultrachess             --engine-b "$(command -v stockfish)"             --validator ./build/ultrachess             --games 24             --depth 5             --threads 1             --hash-mb 64             --alternate             --openings tools/benchmark/openings_12x4.txt             --jsonl-out results/reference-24g.jsonl             --pgn-out results/reference-24g.pgn
          python3 tools/rating/analyze_jsonl.py             results/reference-24g.jsonl             --require-games 24             --require-alternating

      - name: Upload benchmark data
        uses: actions/upload-artifact@v4
        with:
          name: ultrachess-reference-24g-v4
          path: |
            results/
            results-stockfish-version.txt
          retention-days: 30
