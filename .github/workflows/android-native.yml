name: Android native

permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure native test build
        run: cmake -S . -B build-ci -DCMAKE_BUILD_TYPE=Release -DCHESSZERO_BUILD_TESTS=ON
      - name: Build native engine and test suite
        run: cmake --build build-ci -j2
      - name: Verify vendored Fathom snapshot
        run: bash tools/verify_fathom_vendor.sh
      - name: Run native test suite
        run: ctest --test-dir build-ci --output-on-failure
      - name: Run Python and shell validation
        run: |
          python3 -m py_compile $(find tools tests -type f -name '*.py')
          for f in android/build_apk.sh tools/android/*.sh tools/*.sh tools/match/*.sh; do bash -n "$f"; done
          python3 tests/v108_android_integration_tests.py
          python3 tests/v109_release_packaging_tests.py
          python3 tests/v110_nnue_oex_packaging_tests.py
          python3 tests/v111_nnue_1m_network_tests.py
          python3 tests/v107_gradle_wrapper_tests.py

  arm64-oex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Android NDK
        uses: android-actions/setup-android@v4
      - name: Install Android NDK and CMake
        run: sdkmanager "ndk;29.0.14206865" "cmake;3.22.1"
      - name: Build arm64-v8a native engine
        env:
          ANDROID_ABI: arm64-v8a
          ANDROID_PLATFORM: android-24
          CHESSZERO_ENABLE_LTO: OFF
          CHESSZERO_ANDROID_16K: ON
          CHESSZERO_FATHOM_OFFLINE: ON
        run: |
          echo "$ANDROID_SDK_ROOT/cmake/3.22.1/bin" >> "$GITHUB_PATH"
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/29.0.14206865"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          bash tools/android/build_oex.sh
      - name: Check ELF alignment
        run: bash tools/android/check_elf_16k.sh build-android/chesszero

  apk-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK, NDK and CMake
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.14206865" "cmake;3.22.1"
      - name: Validate Android and OEX integration
        run: python3 tests/v108_android_integration_tests.py
      - name: Validate embedded NNUE/OEX packaging contract
        run: python3 tests/v110_nnue_oex_packaging_tests.py
      - name: Validate 1M NNUE network integrity
        run: python3 tests/v111_nnue_1m_network_tests.py
      - name: Validate release packaging metadata
        run: python3 tests/v109_release_packaging_tests.py
      - name: Validate Gradle wrapper metadata
        run: python3 tests/v107_gradle_wrapper_tests.py
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
      - name: Build release APK with Gradle Wrapper
        working-directory: android
        run: |
          EXTRA_ARGS=""
          if [ -f keystore.properties ]; then
            EXTRA_ARGS="-PchesszeroSigningStoreFile=release-keystore.jks \
              -PchesszeroSigningStorePassword=${{ secrets.CHESSZERO_SIGNING_STORE_PASSWORD }} \
              -PchesszeroSigningKeyAlias=${{ secrets.CHESSZERO_SIGNING_KEY_ALIAS }} \
              -PchesszeroSigningKeyPassword=${{ secrets.CHESSZERO_SIGNING_KEY_PASSWORD }}"
          fi
          bash ./gradlew :app:assembleRelease -PchesszeroFathomOffline=true --no-daemon $EXTRA_ARGS
      - name: Validate release APK (OEX + JNI + 16 KB)
        run: bash tools/android/validate_apk.sh
      - name: Publish APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: chesszero-android-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
