plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ultrachess.oex'
    compileSdk 35

    defaultConfig {
        applicationId "com.ultrachess.oex"
        minSdk 24
        targetSdk 28
        versionCode 14
        versionName "0.14"

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    buildFeatures {
        buildConfig true
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
}
